<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Quin DENGIKEN - ロボカップサッカーチーム</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #ffd60a;
            --bg-color-1: #0a0a0a;
            --bg-color-2: #1a1a2e;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            color: #e0e0e0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .grid-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 30px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        nav a:hover::after {
            width: 100%;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 0;
        }

        .hero-content {
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: 72px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3)) drop-shadow(0 0 40px rgba(255, 214, 10, 0.2));
        }

        .hero p {
            font-size: 20px;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--primary-color), #00a8cc);
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            border: 2px solid transparent;
        }

        .cta-button:hover {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.8);
            transform: translateY(-3px);
        }



        section {
            padding: 80px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        h2 {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            margin-bottom: 50px;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.2));
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text h3 {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .about-text p {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            transform: translateY(-5px);
        }

        .stat-card .number {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .stat-card .label {
            font-size: 14px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .member-card {
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .member-card:hover {
            background: rgba(26, 26, 46, 0.9);
            border-color: rgba(255, 214, 10, 0.4);
            box-shadow: 0 0 20px rgba(255, 214, 10, 0.2);
            transform: translateY(-10px);
        }

        .member-avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0a0a0a;
            font-size: 40px;
        }

        .member-card h3 {
            color: #ffffff;
            margin-bottom: 5px;
            font-family: 'Orbitron', monospace;
        }

        .member-role {
            color: var(--secondary-color);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .member-bio {
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .schedule-table th {
            background: rgba(0, 212, 255, 0.1);
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            padding: 20px;
            text-align: left;
            color: var(--primary-color);
            font-family: 'Orbitron', monospace;
        }

        .schedule-table td {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .schedule-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-upcoming {
            background: rgba(0, 212, 255, 0.2);
            color: var(--primary-color);
            border: 1px solid rgba(0, 212, 255, 0.4);
        }

        .status-completed {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff64;
            border: 1px solid rgba(0, 255, 100, 0.4);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            aspect-ratio: 1;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }

        .gallery-item:hover {
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(255, 214, 10, 0.1));
            font-size: 48px;
            color: rgba(0, 212, 255, 0.3);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .blog-card {
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .blog-card:hover {
            border-color: rgba(255, 214, 10, 0.4);
            box-shadow: 0 0 20px rgba(255, 214, 10, 0.2);
            transform: translateY(-8px);
        }

        .blog-date {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary-color);
            padding: 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .blog-content {
            padding: 20px;
        }

        .blog-content h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-family: 'Orbitron', monospace;
        }

        .blog-content p {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .read-more {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .read-more:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .contact-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #e0e0e0;
            border-radius: 4px;
            font-family: 'Noto Sans JP', sans-serif;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            background: rgba(26, 26, 46, 0.8);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .submit-btn:hover {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
            transform: translateY(-3px);
        }

        footer {
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            padding: 40px 0;
            text-align: center;
            color: #b0b0b0;
        }

        .footer-content {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-section h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
        }

        .footer-section a {
            display: block;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 13px;
            margin: 5px 0;
            transition: color 0.3s;
        }

        .footer-section a:hover {
            color: var(--primary-color);
        }

        .footer-copyright {
            font-size: 12px;
            color: #808080;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            padding-top: 20px;
        }

        /* Admin Panel */
        .admin-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
        }

        .admin-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 50%;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .admin-btn:hover {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a0a 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 4px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            z-index: 1000;
        }

        .admin-modal.active {
            display: block;
        }

        .admin-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .admin-modal-overlay.active {
            display: block;
        }

        .admin-modal h2 {
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 20px;
            background: none;
            clip-path: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
        }

        .admin-modal input[type="file"] {
            width: 100%;
            margin-bottom: 15px;
        }

        .admin-modal button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: #0a0a0a;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .admin-modal button:hover {
            opacity: 0.9;
        }

        .admin-modal button.close {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 48px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .about-grid {
                grid-template-columns: 1fr;
            }

            .hero-logo {
                width: 200px;
                height: 200px;
            }

            .footer-content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="grid-bg"></div>
    </div>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo" id="headerLogo">Quin DENGIKEN</div>
                <nav id="headerNav">
                    <a href="#about">チーム紹介</a>
                    <a href="#members">メンバー</a>
                    <a href="#schedule">スケジュール</a>
                    <a href="#gallery">ギャラリー</a>
                    <a href="#blog">ブログ</a>
                    <a href="#contact">問い合わせ</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 id="heroTitle">Quin DENGIKEN</h1>
                <p id="heroSubtitle">芝浦工業大学附属中学高等学校 電子技術研究部</p>
                <p id="heroCatchphrase" style="font-size: 16px; color: #808080; margin-bottom: 30px;"></p>
                <a href="#about" class="cta-button">詳しく見る</a>
            </div>
        </div>
    </section>

    <section id="about">
        <div class="container">
            <h2>チーム紹介</h2>
            <div class="about-grid">
                <div class="about-text">
                    <h3>Quin DENGIKENについて</h3>
                    <p id="aboutText"></p>
                    <div class="stats" id="statsContainer"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="members">
        <div class="container">
            <h2>メンバー</h2>
            <div class="members-grid" id="membersContainer"></div>
        </div>
    </section>

    <section id="schedule">
        <div class="container">
            <h2>大会スケジュール</h2>
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th>開催日</th>
                        <th>大会名</th>
                        <th>開催地</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="scheduleContainer"></tbody>
            </table>
        </div>
    </section>

    <section id="gallery">
        <div class="container">
            <h2>ギャラリー</h2>
            <div class="gallery-grid" id="galleryContainer"></div>
        </div>
    </section>

    <section id="blog">
        <div class="container">
            <h2>ブログ・お知らせ</h2>
            <div class="blog-grid" id="blogContainer"></div>
        </div>
    </section>

    <section id="contact">
        <div class="container">
            <h2>お問い合わせ</h2>
            <div class="contact-content">
                <form id="contactForm" name="contact" method="POST" netlify>
                    <div class="form-group">
                        <label for="contactName">お名前</label>
                        <input type="text" id="contactName" required>
                    </div>
                    <div class="form-group">
                        <label for="contactEmail">メールアドレス</label>
                        <input type="email" id="contactEmail" required>
                    </div>
                    <div class="form-group" id="phoneFieldGroup" style="display: none;">
                        <label for="contactPhone">電話番号</label>
                        <input type="tel" id="contactPhone">
                    </div>
                    <div class="form-group" id="companyFieldGroup" style="display: none;">
                        <label for="contactCompany">会社名</label>
                        <input type="text" id="contactCompany">
                    </div>
                    <div class="form-group">
                        <label for="contactSubject">件名</label>
                        <input type="text" id="contactSubject">
                    </div>
                    <div class="form-group">
                        <label for="contactMessage">メッセージ</label>
                        <textarea id="contactMessage" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">送信</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-content" id="footerContainer"></div>
            <div class="footer-copyright" id="copyrightContainer"></div>
        </div>
    </footer>

    <!-- Admin Panel -->
    <div class="admin-panel">
        <button class="admin-btn" onclick="toggleAdminModal()" title="データ管理">⚙️</button>
    </div>

    <div class="admin-modal-overlay" id="adminOverlay" onclick="closeAdminModal()"></div>
    <div class="admin-modal" id="adminModal">
        <h2>データ管理</h2>
        <p style="color: #b0b0b0; margin-bottom: 20px; font-size: 13px;">CMS管理画面で出力したJSONファイルをインポートしてください</p>
        <input type="file" id="importFile" accept=".json">
        <button onclick="importData()">JSONをインポート</button>
        <button class="close" onclick="closeAdminModal()">閉じる</button>
    </div>

    <script>
        // Default data structure
        const defaultData = {
            site: {
                title: 'Quin DENGIKEN',
                subtitle: '芝浦工業大学附属中学高等学校 電子技術研究部',
                catchphrase: '赤外線ビジョンを搭載したロボカップサッカーチーム',
                logoImage: '',
                colors: {
                    primary: '#00d4ff',
                    secondary: '#ffd60a',
                    bg1: '#0a0a0a',
                    bg2: '#1a1a2e'
                }
            },
            about: {
                text: 'Quin_DENGIKENは、芝浦工業大学附属中学高等学校の電子技術研究部に属するロボカップサッカーチームです。',
                stats: { robots: '15+', members: '20+', domestic: '5+', international: '2+' }
            },
            members: [
                { avatar: '🤖', avatarImage: '', name: '田中 太郎', role: 'チームキャプテン', bio: 'ロボットの制御システムとAIアルゴリズムを担当。' }
            ],
            schedule: [
                { date: '2024-08-02', name: 'ロボカップジャパンオープン 2024', location: '東京都', status: 'completed' }
            ],
            gallery: [
                { url: '', imageData: '', title: 'ギャラリー画像1' },
                { url: '', imageData: '', title: 'ギャラリー画像2' }
            ],
            blog: [
                { date: '2024-09-20', title: '新ロボット「AURORA」がデビュー', content: '最新のAIアルゴリズムを搭載した新ロボット「AURORA」が完成しました。' }
            ],
            contact: {
                email: 'contact@example.com',
                showPhone: true,
                showCompany: true
            },
            footer: {
                section1: { title: 'Quin DENGIKEN', links: ['ホーム', 'チーム紹介', 'メンバー'] },
                section2: { title: '大会情報', links: ['スケジュール', 'ギャラリー', 'ブログ'] },
                section3: { title: '連絡先', email: 'quin@example.com', info: 'お問い合わせ' },
                copyright: '© 2024 Quin_DENGIKEN All Rights Reserved.'
            }
        };

        let currentData = JSON.parse(localStorage.getItem('quinData')) || defaultData;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            applyData();
            setupParticles();
            setupForm();
        });

        // Apply data to page
        function applyData() {
            const data = currentData;

            // Update colors
            document.documentElement.style.setProperty('--primary-color', data.site.colors.primary);
            document.documentElement.style.setProperty('--secondary-color', data.site.colors.secondary);
            document.documentElement.style.setProperty('--bg-color-1', data.site.colors.bg1);
            document.documentElement.style.setProperty('--bg-color-2', data.site.colors.bg2);

            // Update page title
            document.title = data.site.title;
            document.getElementById('pageTitle').textContent = data.site.title;

            // Update header
            if (data.site.logoImage) {
                document.getElementById('headerLogo').innerHTML = `<img src="${data.site.logoImage}" style="height: 40px; object-fit: contain;">`;
            } else {
                document.getElementById('headerLogo').textContent = data.site.title;
            }

            // Update hero
            document.getElementById('heroTitle').textContent = data.site.title;
            document.getElementById('heroSubtitle').textContent = data.site.subtitle;
            document.getElementById('heroCatchphrase').textContent = data.site.catchphrase;

            // Update about
            document.getElementById('aboutText').textContent = data.about.text;
            renderStats(data.about.stats);

            // Update members
            renderMembers(data.members);

            // Update schedule
            renderSchedule(data.schedule);

            // Update gallery
            renderGallery(data.gallery);

            // Update blog
            renderBlog(data.blog);

            // Update footer
            renderFooter(data.footer);

            // Update contact form
            document.getElementById('phoneFieldGroup').style.display = data.contact.showPhone ? 'block' : 'none';
            document.getElementById('companyFieldGroup').style.display = data.contact.showCompany ? 'block' : 'none';
        }

        function renderStats(stats) {
            const container = document.getElementById('statsContainer');
            container.innerHTML = `
                <div class="stat-card">
                    <div class="number">${stats.robots}</div>
                    <div class="label">ロボット</div>
                </div>
                <div class="stat-card">
                    <div class="number">${stats.members}</div>
                    <div class="label">チームメンバー</div>
                </div>
                <div class="stat-card">
                    <div class="number">${stats.domestic}</div>
                    <div class="label">国内大会</div>
                </div>
                <div class="stat-card">
                    <div class="number">${stats.international}</div>
                    <div class="label">国際大会</div>
                </div>
            `;
        }

        function renderMembers(members) {
            const container = document.getElementById('membersContainer');
            container.innerHTML = members.map(member => {
                let avatarHTML = '';
                if (member.avatarImage) {
                    avatarHTML = `<img src="${member.avatarImage}" alt="${member.name}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color);">`;
                } else {
                    avatarHTML = `<div class="member-avatar">${member.avatar}</div>`;
                }
                
                return `
                    <div class="member-card">
                        ${avatarHTML}
                        <h3>${member.name}</h3>
                        <div class="member-role">${member.role}</div>
                        <p class="member-bio">${member.bio}</p>
                    </div>
                `;
            }).join('');
        }

        function renderSchedule(schedule) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = schedule.map(event => `
                <tr>
                    <td>${event.date}</td>
                    <td>${event.name}</td>
                    <td>${event.location}</td>
                    <td><span class="status-badge status-${event.status}">${event.status === 'completed' ? '終了' : '予定中'}</span></td>
                </tr>
            `).join('');
        }

        function renderGallery(gallery) {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = gallery.map(item => {
                if (item.imageData) {
                    return `
                        <div class="gallery-item">
                            <img src="${item.imageData}" alt="${item.title}" class="gallery-image">
                        </div>
                    `;
                } else if (item.url && item.url.startsWith('http')) {
                    return `
                        <div class="gallery-item">
                            <img src="${item.url}" alt="${item.title}" class="gallery-image" onerror="this.parentElement.innerHTML='<div class=\"gallery-placeholder\">📷</div>'">
                        </div>
                    `;
                } else {
                    return `
                        <div class="gallery-item">
                            <div class="gallery-placeholder">📷</div>
                        </div>
                    `;
                }
            }).join('');
        }

        function renderBlog(blog) {
            const container = document.getElementById('blogContainer');
            container.innerHTML = blog.map(post => `
                <div class="blog-card">
                    <div class="blog-date">${post.date}</div>
                    <div class="blog-content">
                        <h3>${post.title}</h3>
                        <p>${post.content}</p>
                        <a href="#" class="read-more">続きを読む →</a>
                    </div>
                </div>
            `).join('');
        }

        function renderFooter(footer) {
            const container = document.getElementById('footerContainer');
            container.innerHTML = `
                <div class="footer-section">
                    <h3>${footer.section1.title}</h3>
                    ${footer.section1.links.map(link => `<a href="#">${link}</a>`).join('')}
                </div>
                <div class="footer-section">
                    <h3>${footer.section2.title}</h3>
                    ${footer.section2.links.map(link => `<a href="#">${link}</a>`).join('')}
                </div>
                <div class="footer-section">
                    <h3>${footer.section3.title}</h3>
                    <a href="mailto:${footer.section3.email}">${footer.section3.email}</a>
                    <a href="#">${footer.section3.info}</a>
                </div>
            `;
            document.getElementById('copyrightContainer').innerHTML = `<p>${footer.copyright}</p>`;
        }

        // Particles
        function setupParticles() {
            const bgAnimation = document.querySelector('.background-animation');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                bgAnimation.appendChild(particle);
            }
        }

        // Form setup
        function setupForm() {
            document.getElementById('contactForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('ありがとうございます。メッセージを送信しました。');
                this.reset();
            });

            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }

        // Admin functions
        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('active');
            document.getElementById('adminOverlay').classList.toggle('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminOverlay').classList.remove('active');
        }

        function importData() {
            const file = document.getElementById('importFile').files[0];
            if (!file) {
                alert('ファイルを選択してください');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    currentData = importedData;
                    localStorage.setItem('quinData', JSON.stringify(currentData));
                    applyData();
                    alert('データをインポートしました。ページを再読み込みします。');
                    location.reload();
                } catch (error) {
                    alert('JSONファイルが無効です');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
